<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#202124">EIS Analysis Workflow Architecture</text>
  
  <!-- User -->
  <circle cx="75" cy="100" r="30" fill="#4285F4" />
  <text x="75" y="105" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">User</text>
  
  <!-- Frontend -->
  <rect x="150" y="70" width="120" height="60" rx="10" ry="10" fill="#34A853" stroke="#202124" stroke-width="2"/>
  <text x="210" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Frontend</text>
  <text x="210" y="120" font-family="Arial" font-size="10" text-anchor="middle" fill="white">React + Cloud Run</text>
  
  <!-- Backend -->
  <rect x="350" y="70" width="120" height="60" rx="10" ry="10" fill="#EA4335" stroke="#202124" stroke-width="2"/>
  <text x="410" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Backend API</text>
  <text x="410" y="120" font-family="Arial" font-size="10" text-anchor="middle" fill="white">FastAPI + Cloud Run</text>
  
  <!-- Cloud Workflow -->
  <rect x="550" y="70" width="120" height="60" rx="10" ry="10" fill="#FBBC05" stroke="#202124" stroke-width="2"/>
  <text x="610" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Workflow</text>
  <text x="610" y="120" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Cloud Workflows</text>
  
  <!-- Document AI -->
  <rect x="250" y="200" width="120" height="60" rx="10" ry="10" fill="#4285F4" stroke="#202124" stroke-width="2"/>
  <text x="310" y="235" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Document AI</text>
  <text x="310" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Text Extraction</text>
  
  <!-- Vertex AI -->
  <rect x="450" y="200" width="120" height="60" rx="10" ry="10" fill="#4285F4" stroke="#202124" stroke-width="2"/>
  <text x="510" y="235" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Vertex AI</text>
  <text x="510" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Text Analysis</text>
  
  <!-- Cloud Storage -->
  <rect x="350" y="330" width="120" height="60" rx="10" ry="10" fill="#34A853" stroke="#202124" stroke-width="2"/>
  <text x="410" y="365" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Cloud Storage</text>
  <text x="410" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Document Storage</text>
  
  <!-- Connections -->
  <!-- User to Frontend -->
  <line x1="105" y1="100" x2="150" y2="100" stroke="#202124" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Frontend to Backend -->
  <line x1="270" y1="100" x2="350" y2="100" stroke="#202124" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backend to Workflow -->
  <line x1="470" y1="100" x2="550" y2="100" stroke="#202124" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Workflow to Document AI -->
  <path d="M 610 130 C 610 150 400 150 310 200" stroke="#202124" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Workflow to Vertex AI -->
  <path d="M 610 130 C 610 170 550 170 510 200" stroke="#202124" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Document AI to Storage -->
  <line x1="310" y1="260" x2="380" y2="330" stroke="#202124" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Vertex AI to Storage -->
  <line x1="510" y1="260" x2="440" y2="330" stroke="#202124" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Storage to Backend (bidirectional) -->
  <path d="M 410 330 C 350 300 350 130 380 130" stroke="#202124" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Process Steps - FIXED: Made box wider and adjusted text positioning and spacing -->
  <rect x="625" y="150" width="165" height="240" rx="10" ry="10" fill="white" stroke="#202124" stroke-width="1"/>
  <text x="707" y="175" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Analysis Steps</text>
  
  <!-- Fixed spacing between numbers and text -->
  <circle cx="645" cy="200" r="10" fill="#4285F4" />
  <text x="645" y="204" font-family="Arial" font-size="12" text-anchor="middle" fill="white">1</text>
  <text x="665" y="204" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Document Upload</text>
  
  <circle cx="645" cy="230" r="10" fill="#4285F4" />
  <text x="645" y="234" font-family="Arial" font-size="12" text-anchor="middle" fill="white">2</text>
  <text x="665" y="234" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Text Extraction</text>
  
  <circle cx="645" cy="260" r="10" fill="#4285F4" />
  <text x="645" y="264" font-family="Arial" font-size="12" text-anchor="middle" fill="white">3</text>
  <text x="665" y="264" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Classification</text>
  
  <circle cx="645" cy="290" r="10" fill="#4285F4" />
  <text x="645" y="294" font-family="Arial" font-size="12" text-anchor="middle" fill="white">4</text>
  <text x="665" y="294" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Sentiment Analysis</text>
  
  <circle cx="645" cy="320" r="10" fill="#4285F4" />
  <text x="645" y="324" font-family="Arial" font-size="12" text-anchor="middle" fill="white">5</text>
  <text x="665" y="324" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Key Concerns</text>
  
  <circle cx="645" cy="350" r="10" fill="#4285F4" />
  <text x="645" y="354" font-family="Arial" font-size="12" text-anchor="middle" fill="white">6</text>
  <text x="665" y="354" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Results Visualization</text>
  
  <!-- Results Flow back to User -->
  <path d="M 350 100 C 250 50 150 50 100 90" stroke="#202124" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#202124">Analysis Results</text>
  
  <!-- Legend -->
  <rect x="10" y="430" width="780" height="60" rx="5" ry="5" fill="white" stroke="#202124" stroke-width="1"/>
  <text x="400" y="450" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Google Cloud Services Legend</text>
  
  <rect x="50" y="460" width="20" height="20" fill="#4285F4"/>
  <text x="80" y="475" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">AI/ML Services</text>
  
  <rect x="200" y="460" width="20" height="20" fill="#34A853"/>
  <text x="230" y="475" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Storage/Hosting</text>
  
  <rect x="350" y="460" width="20" height="20" fill="#EA4335"/>
  <text x="380" y="475" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Compute Services</text>
  
  <rect x="500" y="460" width="20" height="20" fill="#FBBC05"/>
  <text x="530" y="475" font-family="Arial" font-size="12" text-anchor="start" fill="#202124">Orchestration</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#202124"/>
    </marker>
  </defs>
</svg>